# Bản tin tự động dựng bằng MẪU từ câu hỏi nhanh – KHÔNG qua AI (D-143, anh chốt 2026-11-28).
# AppDelicare.Job chạy đúng giờ → chạy lần lượt các câu nhanh (bằng quyền của từng người nhận) → ghép thành 1 tin → OutboundMessage (bot DH / VH) + ghi kho thư mục 10.
# Người nhận = người có quyền Xem mục ObjectMenu của bản tin (ẩn khỏi sidebar, cấp trên ma trận quyền cũ) và đã liên kết Telegram. Không liệt kê người / nhóm trong tệp này.
# Mỗi khối chỉ in câu "tom_tat" + tối đa "dong" dòng đầu; khối không có dòng nào in câu "rong" (tin tốt) hoặc bỏ nếu "an_khi_rong: true".
# Nhận xét AI (2–3 dòng cuối tin) chỉ khi cấu hình Agent:BriefingAiComment = true (mặc định false → 0 token).
