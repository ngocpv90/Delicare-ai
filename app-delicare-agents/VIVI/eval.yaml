# Bộ câu nghiệm thu agent VIVI (AI-7, D-133). Chạy: node tools/agent-eval/run.mjs VIVI
agent: VIVI
webUser: uat.ceo
cases:
  - id: vivi-dieu-hanh
    question: Hôm nay vận hành thế nào?
    tool: bao_cao_dieu_hanh
    args: {}
    expect:
      status: 200
      has: [kpi, kpi.orders, alerts]
      equalsWeb: { tool: kpi.orders.total, web: "Dashboard/GetExecutive", webPath: data.kpi.orders.total }
  - id: vivi-kpi-tuan
    question: KPI 7 ngày qua?
    tool: kpi_khoang
    args: {}
    expect:
      status: 200
  - id: vivi-su-co
    question: Hôm nay có sự cố gì?
    tool: su_co_ngay
    args: {}
    expect:
      status: 200
      has: [canh_bao, ngay]
  - id: vivi-cho-duyet
    question: Có gì đang chờ tôi duyệt?
    tool: ds_cho_duyet
    args: {}
    expect:
      status: 200
  - id: vivi-su-kien
    question: (theo lịch 5 phút) sự kiện mới
    tool: lay_su_kien
    args: {}
    expect:
      status: 200
      has: [items, next]
  - id: vivi-phan-anh
    question: Phản ánh nào đang quá hạn?
    tool: phan_anh_khach
    args: { qua_han: true }
    expect:
      status: 200
      notContains: "@"
  - id: vivi-ngay-sai
    question: Báo cáo ngày 31-31-2026
    tool: bao_cao_dieu_hanh
    args: { ngay: 31-31-2026 }
    expect:
      status: 400
      contains: không hợp lệ
  - id: vivi-kho-cong-van # AI-22 (§7.10)
    question: Công văn số 125 yêu cầu gì, hạn khi nào?
    tool: tim_tri_thuc
    args: { cau_hoi: "cong van 125" }
    expect:
      status: 200
  - id: vivi-kho-doc-sai # AI-22 (§7.10)
    question: Đọc tài liệu không có
    tool: doc_tai_lieu
    args: { id: KHONG-CO-TAI-LIEU }
    expect:
      status: 400
  # AI-23.4 (D-142): người hỏi qua Telegram bị từ chối – ToolGateway trả mã, Vivi trả đúng câu theo SOUL.
  - id: vivi-chua-lien-ket
    question: (Telegram, tài khoản chưa liên kết) Tồn kho hôm nay?
    tool: bao_cao_dieu_hanh
    args: {}
    onBehalfOf: "900000001"
    expect:
      status: 403
      code: CHUA_LIEN_KET
  - id: vivi-khong-quyen-tro-ly
    question: (Telegram, đã liên kết nhưng chưa có quyền "Dùng bot Trợ lý") Hôm nay vận hành thế nào?
    tool: bao_cao_dieu_hanh
    args: {}
    onBehalfOfEnv: EVAL_TG_NO_RIGHT
    expect:
      status: 403
      code: KHONG_CO_QUYEN_TRO_LY
  - id: vivi-bot-tam-dung
    question: (Telegram, bot Trợ lý đang tạm dừng trên tab Bot Trợ lý) Hôm nay vận hành thế nào?
    tool: bao_cao_dieu_hanh
    args: {}
    onBehalfOfEnv: EVAL_TG_BOT_OFF
    expect:
      status: 403
      code: BOT_TRO_LY_TAT
