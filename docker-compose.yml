# DELICARE – chạy web + API bằng Docker trên server dev / test (DB là SQL Server có sẵn bên ngoài, KHÔNG kèm trong file này).
#
# Chuẩn bị (1 lần):   cp .env.example .env    rồi điền DB_USER, DB_PASSWORD, JWT_SIGNING_KEY   (.env KHÔNG commit)
# Chạy / cập nhật:     docker compose up -d --build
#
#   Web  : http://<server>:4444           (đổi bằng WEB_PORT trong .env)
#   API  : http://<server>:5125/swagger   (đổi bằng API_PORT trong .env; trong mạng Docker là api:8080)
#
# ĐỒNG BỘ DATABASE TỰ ĐỘNG: mỗi lần "up", dịch vụ db-sync chạy TRƯỚC api (deploy/db/migrate.sh), xong mới khởi động api:
#   - DB trống → tạo đủ 124 bảng từ DDL chuẩn;
#   - cập nhật stored procedure + thêm seed còn thiếu (chạy lại an toàn);
#   - DB thiếu bảng / cột so với bản code → DỪNG và in danh sách; đặt DB_AUTO_MIGRATE=1 để tự nâng cấp bằng DB/migrations (backup trước).
# Tắt đồng bộ: DB_AUTO_SYNC=0 trong .env. Chạy riêng:  docker compose run --rm db-sync
# Bộ đầy đủ có SQL Server riêng trong Docker: deploy/docker/docker-compose.staging.yml; production (HTTPS): docker-compose.production.yml.
services:
  api:
    build:
      context: ./AppDelicare
      dockerfile: AppDelicare.WebApi/Dockerfile
    container_name: delicare-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Staging}
      TZ: Asia/Ho_Chi_Minh
      # Bí mật lấy từ .env (không nằm trong image, không nằm trong repo).
      ConnectionStrings__MainConnectionString: "Server=${DB_SERVER:?Đặt DB_SERVER trong .env};Database=${DB_NAME:?Đặt DB_NAME trong .env};User Id=${DB_USER:?Đặt DB_USER trong .env};Password=${DB_PASSWORD:?Đặt DB_PASSWORD trong .env};Encrypt=${DB_ENCRYPT:-False};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Đặt JWT_SIGNING_KEY (>= 32 ký tự) trong .env}
      Licenses__GemBox: ${GEMBOX_LICENSE:-}
      DocumentStorage__RootPath: /app/App_Data/DocumentFiles
      Logging__ConsoleOnly: "true"
      # BOT-1.1 / 1.2 (D-62): khóa client messaging (SHA-256 hex) + khóa ký mã liên kết Telegram – trống = tắt.
      Clients__MESSAGING__KeyHash: ${MESSAGING_CLIENT_KEY_HASH:-}
      Messaging__LinkSigningKey: ${MESSAGING_LINK_SIGNING_KEY:-}
    volumes:
      - api-import:/app/wwwroot/Import            # ảnh đại diện / tệp nhập Excel
      - api-docs:/app/App_Data/DocumentFiles      # tệp đính kèm (DocumentFile)
    depends_on:
      db-sync:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-5125}:8080"

  web:
    build:
      context: ./app-delicare-client
      dockerfile: Dockerfile
    container_name: delicare-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4444}:80"                    # nginx trong container: phục vụ Angular + chuyển /api, /Import → api:8080

  # Job tự động (khóa đơn 20h, MRP, KPI…): CHỈ bật khi DB này là của riêng môi trường đang chạy.
  #   docker compose --profile job up -d --build
  job:
    profiles: ["job"]
    build:
      context: ./AppDelicare
      dockerfile: AppDelicare.Job/Dockerfile
    container_name: delicare-job
    restart: unless-stopped
    depends_on:
      db-sync:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: ${APP_ENVIRONMENT:-Staging}
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__MainConnectionString: "Server=${DB_SERVER:?Đặt DB_SERVER trong .env};Database=${DB_NAME:?Đặt DB_NAME trong .env};User Id=${DB_USER:?Đặt DB_USER trong .env};Password=${DB_PASSWORD:?Đặt DB_PASSWORD trong .env};Encrypt=${DB_ENCRYPT:-False};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Licenses__GemBox: ${GEMBOX_LICENSE:-}
      DocumentStorage__RootPath: /app/App_Data/DocumentFiles
    volumes:
      - api-docs:/app/App_Data/DocumentFiles

  # Đồng bộ database trước khi api chạy (xem đầu file). Tài khoản SQL trong .env cần quyền tạo stored procedure
  # (và quyền ALTER / BACKUP nếu bật DB_AUTO_MIGRATE).
  db-sync:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      DB_AUTO_SYNC: ${DB_AUTO_SYNC:-1}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-0}
      DB_BACKUP_BEFORE_MIGRATE: ${DB_BACKUP_BEFORE_MIGRATE:-1}
      DB_ALLOW_SCHEMA_DRIFT: ${DB_ALLOW_SCHEMA_DRIFT:-0}
      DB_SERVER: ${DB_SERVER}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      SA_PASSWORD: ${DB_PASSWORD}
      # Chỉ dùng khi DB chưa có tài khoản admin của ứng dụng.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./docs/reference:/repo/docs/reference:ro
      - ./DB:/repo/DB:ro
      - ./deploy/db:/repo/deploy/db:ro
      - ./deploy/docker/db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/bash", "/repo/deploy/db/migrate.sh"]
    restart: "no"

  # BOT-1.3 (D-62): container messaging – TẤT CẢ bot (Telegram VH / DH), ĐÚNG 1 bản. Không chuỗi kết nối DB – gọi api qua mạng Docker.
  messaging:
    build:
      context: ./AppDelicare
      dockerfile: AppDelicare.Messaging/Dockerfile
    depends_on:
      - api
    environment:
      TZ: Asia/Ho_Chi_Minh
      Messaging__ApiBaseUrl: http://api:8080
      Messaging__ClientKey: ${MESSAGING_CLIENT_KEY:-}
      Messaging__Mode: ${MESSAGING_MODE:-Polling}
      Messaging__WebhookBaseUrl: ${MESSAGING_WEBHOOK_BASE_URL:-}
      Telegram__Bots__VH__Token: ${TELEGRAM_VH_TOKEN:-}
      Telegram__Bots__VH__WebhookSecret: ${TELEGRAM_VH_WEBHOOK_SECRET:-}
      Telegram__Bots__VH__Username: ${TELEGRAM_VH_USERNAME:-}
      Telegram__Bots__DH__Token: ${TELEGRAM_DH_TOKEN:-}
      Telegram__Bots__DH__WebhookSecret: ${TELEGRAM_DH_WEBHOOK_SECRET:-}
      Telegram__Bots__DH__Username: ${TELEGRAM_DH_USERNAME:-}
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  api-import:
  api-docs:
