# DELICARE – chạy web + API bằng Docker trên server dev / test (DB là SQL Server có sẵn bên ngoài, KHÔNG kèm trong file này).
#
# Chuẩn bị (1 lần):   cp .env.example .env    rồi điền DB_USER, DB_PASSWORD, JWT_SIGNING_KEY   (.env KHÔNG commit)
# Chạy / cập nhật:     docker compose up -d --build
#
#   Web  : http://<server>:4444           (đổi bằng WEB_PORT trong .env)
#   API  : http://<server>:5125/swagger   (đổi bằng API_PORT trong .env; trong mạng Docker là api:8080)
#
# ĐỒNG BỘ DATABASE TỰ ĐỘNG: mỗi lần "up", dịch vụ db-sync chạy TRƯỚC api (deploy/db/migrate.sh), xong mới khởi động api:
#   - cấu trúc bảng = migration DB/migrations (mỗi file 1 lần): DB trống → baseline 124 bảng;
#   - cập nhật stored procedure + thêm seed còn thiếu (chạy lại an toàn);
#   - DB đã có bảng mà có migration MỚI đang chờ → DỪNG và in danh sách; đặt DB_AUTO_MIGRATE=1 để tự chạy (backup trước).
# Tắt đồng bộ: DB_AUTO_SYNC=0 trong .env. Chạy riêng:  docker compose run --rm db-sync
# Bộ đầy đủ có SQL Server riêng trong Docker: deploy/docker/docker-compose.staging.yml; production (HTTPS): docker-compose.production.yml.
# AI-15 (D-133): mẫu chung cho 3 container Hermes (YAML anchor, compose bỏ qua khóa x-*).
x-hermes: &hermes
  profiles: ["hermes"]
  image: nousresearch/hermes-agent:latest
  command: ["gateway", "run"]
  depends_on:
    - toolgateway
  expose:
    - "8642"                                       # API server Hermes – chỉ mạng nội bộ (api gọi chat web)
  restart: unless-stopped
x-hermes-env: &hermes-env
  TZ: Asia/Ho_Chi_Minh
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  HERMES_MODEL_DEFAULT: ${HERMES_MODEL_DEFAULT:-claude-sonnet-5-5}
  HERMES_MODEL_SCHEDULED: ${HERMES_MODEL_SCHEDULED:-claude-haiku-5-5}
  API_SERVER_KEY: ${HERMES_API_KEY:-}             # khóa API server Hermes – api gửi Bearer cùng giá trị

services:
  api:
    build:
      context: ./AppDelicare
      dockerfile: AppDelicare.WebApi/Dockerfile
    container_name: delicare-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Staging}
      TZ: Asia/Ho_Chi_Minh
      # Bí mật lấy từ .env (không nằm trong image, không nằm trong repo).
      ConnectionStrings__MainConnectionString: "Server=${DB_SERVER:?Đặt DB_SERVER trong .env};Database=${DB_NAME:?Đặt DB_NAME trong .env};User Id=${DB_USER:?Đặt DB_USER trong .env};Password=${DB_PASSWORD:?Đặt DB_PASSWORD trong .env};Encrypt=${DB_ENCRYPT:-False};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Đặt JWT_SIGNING_KEY (>= 32 ký tự) trong .env}
      Licenses__GemBox: ${GEMBOX_LICENSE:-}
      DocumentStorage__RootPath: /app/App_Data/DocumentFiles
      Knowledge__VaultPath: /app/App_Data/Knowledge
      Logging__ConsoleOnly: "true"
      # BOT-1.1 / 1.2 (D-62): khóa client messaging (SHA-256 hex) + khóa ký mã liên kết Telegram – trống = tắt.
      Clients__MESSAGING__KeyHash: ${MESSAGING_CLIENT_KEY_HASH:-}
      Messaging__LinkSigningKey: ${MESSAGING_LINK_SIGNING_KEY:-}
      Agent__SchedulesFile: /app/app-delicare-agents/schedules.json
      # AI-19 (D-06): Zalo OA khách – token làm mới lần đầu + khóa ứng dụng (sau đó api tự làm mới, lưu mã hóa trong DB).
      Zalo__AppId: ${ZALO_APP_ID:-}
      Zalo__AppSecret: ${ZALO_APP_SECRET:-}
      Zalo__RefreshToken: ${ZALO_REFRESH_TOKEN:-}
      # AI-6 / AI-15: Trung tâm agent báo "máy chủ có khóa agent" – cùng biến với toolgateway (trống = chưa cấp). Đủ 13 agent; agent chưa bật thì để trống.
      AGENT_KEY_VIVI: ${AGENT_KEY_VIVI:-}
      AGENT_KEY_KNOW: ${AGENT_KEY_KNOW:-}
      AGENT_KEY_KITCHEN: ${AGENT_KEY_KITCHEN:-}
      AGENT_KEY_QA: ${AGENT_KEY_QA:-}
      AGENT_KEY_LOG: ${AGENT_KEY_LOG:-}
      AGENT_KEY_PKG: ${AGENT_KEY_PKG:-}
      AGENT_KEY_WH: ${AGENT_KEY_WH:-}
      AGENT_KEY_SALES: ${AGENT_KEY_SALES:-}
      AGENT_KEY_PLAN: ${AGENT_KEY_PLAN:-}
      AGENT_KEY_PROC: ${AGENT_KEY_PROC:-}
      AGENT_KEY_HR: ${AGENT_KEY_HR:-}
      AGENT_KEY_ACC: ${AGENT_KEY_ACC:-}
      AGENT_KEY_CSKH: ${AGENT_KEY_CSKH:-}
      # AI-14 / AI-15 (D-133): chat web – API gọi API server của container Hermes chứa agent (mạng Docker, cổng 8642). Khóa chung HERMES_API_KEY (= API_SERVER_KEY của Hermes).
      Agent__HermesApiUrl: ${HERMES_API_URL:-http://hermes-vivi:8642/v1}
      Agent__HermesApiUrlByAgent__KITCHEN: http://hermes-van-hanh:8642/v1
      Agent__HermesApiUrlByAgent__QA: http://hermes-van-hanh:8642/v1
      Agent__HermesApiUrlByAgent__LOG: http://hermes-van-hanh:8642/v1
      Agent__HermesApiUrlByAgent__PKG: http://hermes-van-hanh:8642/v1
      Agent__HermesApiUrlByAgent__WH: http://hermes-van-hanh:8642/v1
      Agent__HermesApiUrlByAgent__SALES: http://hermes-van-phong:8642/v1
      Agent__HermesApiUrlByAgent__PLAN: http://hermes-van-phong:8642/v1
      Agent__HermesApiUrlByAgent__PROC: http://hermes-van-phong:8642/v1
      Agent__HermesApiUrlByAgent__HR: http://hermes-van-phong:8642/v1
      Agent__HermesApiUrlByAgent__ACC: http://hermes-van-phong:8642/v1
      Agent__HermesApiUrlByAgent__CSKH: http://hermes-van-phong:8642/v1
      HERMES_API_KEY: ${HERMES_API_KEY:-}
    volumes:
      - api-import:/app/wwwroot/Import            # ảnh đại diện / tệp nhập Excel
      - api-docs:/app/App_Data/DocumentFiles      # tệp đính kèm (DocumentFile)
      - knowledge:/app/App_Data/Knowledge          # AI-1 (D-133): kho tri thức (AI-5)
      - ./app-delicare-agents:/app/app-delicare-agents:ro                    # AI-6 / AI-7: app-delicare-agents/schedules.json (màn Lịch chạy) – chỉ đọc
    depends_on:
      db-sync:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-5125}:8080"

  web:
    build:
      context: ./app-delicare-client
      dockerfile: Dockerfile
    container_name: delicare-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4444}:80"                    # nginx trong container: phục vụ Angular + chuyển /api, /Import → api:8080

  # Job tự động (khóa đơn 20h, MRP, KPI…): CHỈ bật khi DB này là của riêng môi trường đang chạy.
  #   docker compose --profile job up -d --build
  job:
    profiles: ["job"]
    build:
      context: ./AppDelicare
      dockerfile: AppDelicare.Job/Dockerfile
    container_name: delicare-job
    restart: unless-stopped
    depends_on:
      db-sync:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: ${APP_ENVIRONMENT:-Staging}
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__MainConnectionString: "Server=${DB_SERVER:?Đặt DB_SERVER trong .env};Database=${DB_NAME:?Đặt DB_NAME trong .env};User Id=${DB_USER:?Đặt DB_USER trong .env};Password=${DB_PASSWORD:?Đặt DB_PASSWORD trong .env};Encrypt=${DB_ENCRYPT:-False};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Licenses__GemBox: ${GEMBOX_LICENSE:-}
      DocumentStorage__RootPath: /app/App_Data/DocumentFiles
      Knowledge__VaultPath: /app/App_Data/Knowledge
    volumes:
      - api-docs:/app/App_Data/DocumentFiles
      - knowledge:/app/App_Data/Knowledge          # AI-1 (D-133): kho tri thức (exporter AI-5)

  # Đồng bộ database trước khi api chạy (xem đầu file). Tài khoản SQL trong .env cần quyền tạo stored procedure
  # (và quyền ALTER / BACKUP nếu bật DB_AUTO_MIGRATE).
  db-sync:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      DB_AUTO_SYNC: ${DB_AUTO_SYNC:-1}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-0}
      DB_BACKUP_BEFORE_MIGRATE: ${DB_BACKUP_BEFORE_MIGRATE:-1}
      DB_ALLOW_SCHEMA_DRIFT: ${DB_ALLOW_SCHEMA_DRIFT:-0}
      DB_SERVER: ${DB_SERVER}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      SA_PASSWORD: ${DB_PASSWORD}
      # Chỉ dùng khi DB chưa có tài khoản admin của ứng dụng.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./docs/reference:/repo/docs/reference:ro
      - ./DB:/repo/DB:ro
      - ./deploy/db:/repo/deploy/db:ro
      - ./deploy/docker/db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/bash", "/repo/deploy/db/migrate.sh"]
    restart: "no"

  # BOT-1.3 (D-62): container messaging – TẤT CẢ bot (Telegram VH / DH), ĐÚNG 1 bản. Không chuỗi kết nối DB – gọi api qua mạng Docker.
  messaging:
    build:
      context: ./AppDelicare
      dockerfile: AppDelicare.Messaging/Dockerfile
    depends_on:
      - api
    environment:
      TZ: Asia/Ho_Chi_Minh
      Messaging__ApiBaseUrl: http://api:8080
      Messaging__ClientKey: ${MESSAGING_CLIENT_KEY:-}
      Messaging__Mode: ${MESSAGING_MODE:-Polling}
      Messaging__WebhookBaseUrl: ${MESSAGING_WEBHOOK_BASE_URL:-}
      Telegram__Bots__VH__Token: ${TELEGRAM_VH_TOKEN:-}
      Telegram__Bots__VH__WebhookSecret: ${TELEGRAM_VH_WEBHOOK_SECRET:-}
      Telegram__Bots__VH__Username: ${TELEGRAM_VH_USERNAME:-}
      Telegram__Bots__DH__Token: ${TELEGRAM_DH_TOKEN:-}
      Telegram__Bots__DH__WebhookSecret: ${TELEGRAM_DH_WEBHOOK_SECRET:-}
      Telegram__Bots__DH__Username: ${TELEGRAM_DH_USERNAME:-}
      # AI-19 (D-06): bot Zalo khách – tắt tới khi có Zalo OA thật (ZALO_ENABLED=true, app id, OA secret key ở .env).
      Zalo__Enabled: ${ZALO_ENABLED:-false}
      Zalo__AppId: ${ZALO_APP_ID:-}
      Zalo__OaSecretKey: ${ZALO_OA_SECRET_KEY:-}
    expose:
      - "8080"
    restart: unless-stopped

  # AI-1 (D-133): ToolGateway – MCP /mcp + REST /tools/{name} cho agent Hermes. CHỈ mạng nội bộ (expose, KHÔNG ports).
  # Chỉ gọi Service (không SQL riêng); khóa agent qua biến môi trường AGENT_KEY_<MÃ> (tên ghi ở BotConfiguration.SecretReference, AI-2).
  toolgateway:
    build:
      context: ./AppDelicare
      dockerfile: AppDelicare.ToolGateway/Dockerfile
    depends_on:
      db-sync:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Staging}
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__MainConnectionString: "Server=${DB_SERVER:?Đặt DB_SERVER trong .env};Database=${DB_NAME:?Đặt DB_NAME trong .env};User Id=${DB_USER:?Đặt DB_USER trong .env};Password=${DB_PASSWORD:?Đặt DB_PASSWORD trong .env};Encrypt=${DB_ENCRYPT:-False};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      DocumentStorage__RootPath: /app/App_Data/DocumentFiles
      Knowledge__VaultPath: /app/App_Data/Knowledge
      # AI-2 / AI-7 / AI-15 (D-133): khóa từng agent (đủ 13) – tên biến ghi ở BotConfiguration.SecretReference; giá trị chỉ ở .env của server.
      AGENT_KEY_VIVI: ${AGENT_KEY_VIVI:-}
      AGENT_KEY_KNOW: ${AGENT_KEY_KNOW:-}
      AGENT_KEY_KITCHEN: ${AGENT_KEY_KITCHEN:-}
      AGENT_KEY_QA: ${AGENT_KEY_QA:-}
      AGENT_KEY_LOG: ${AGENT_KEY_LOG:-}
      AGENT_KEY_PKG: ${AGENT_KEY_PKG:-}
      AGENT_KEY_WH: ${AGENT_KEY_WH:-}
      AGENT_KEY_SALES: ${AGENT_KEY_SALES:-}
      AGENT_KEY_PLAN: ${AGENT_KEY_PLAN:-}
      AGENT_KEY_PROC: ${AGENT_KEY_PROC:-}
      AGENT_KEY_HR: ${AGENT_KEY_HR:-}
      AGENT_KEY_ACC: ${AGENT_KEY_ACC:-}
      AGENT_KEY_CSKH: ${AGENT_KEY_CSKH:-}
    volumes:
      - api-docs:/app/App_Data/DocumentFiles
      - knowledge:/app/App_Data/Knowledge
    expose:
      - "8080"
    restart: unless-stopped

  # AI-15 (D-133): Hermes Agent (Nous Research) tách 3 container theo nhóm – lỗi / quá tải một nhóm không kéo đổ nhóm khác, mỗi container chỉ giữ khóa agent của mình:
  #   hermes-vivi      : VIVI, KNOW                          – bot Trợ lý (Telegram) + chat web mặc định
  #   hermes-van-hanh  : KITCHEN, QA, LOG, PKG, WH          – việc theo lịch vận hành
  #   hermes-van-phong : SALES, PLAN, PROC, HR, ACC, CSKH   – việc theo lịch văn phòng
  # CHỈ bật khi gọi profile "hermes" (lệnh "up" thường không đụng tới):
  #   1) Cấu hình 1 lần MỖI container (mô hình, khóa – lưu trong volume riêng, KHÔNG nằm trong repo / .env):
  #        docker compose --profile hermes run --rm hermes-vivi setup        (tương tự hermes-van-hanh, hermes-van-phong)
  #      config.yaml chép từ app-delicare-agents/hermes/<nhóm>.config.example.yaml; lịch: node tools/agent-eval/gen-cron.mjs --group <nhóm>
  #   2) Chạy nền:   docker compose --profile hermes up -d        Xem log:   docker compose logs -f hermes-vivi
  # Không chuỗi kết nối DB (D-62): Hermes chỉ gọi Tool Gateway qua mạng Docker. API server Hermes (8642) chỉ mạng nội bộ – api gọi để chat web (AI-14).
  # Dùng volume có tên (không gắn thư mục máy): Docker Desktop trên Windows gắn thư mục làm hỏng SQLite của Hermes. MỖI container ĐÚNG 1 volume, không dùng chung.
  # Nâng cấp từ 1 container (trước AI-15): hermes-vivi giữ volume cũ hermes-data → lịch sử bot Trợ lý còn nguyên; 2 container mới cấu hình từ đầu.
  hermes-vivi:
    <<: *hermes
    container_name: delicare-hermes-vivi
    environment:
      <<: *hermes-env
      HERMES_GROUP: vivi                       # app-delicare-agents/hermes/vivi.config.example.yaml + node tools/agent-eval/gen-cron.mjs --group vivi
      TELEGRAM_BOT_TOKEN_TRO_LY: ${TELEGRAM_BOT_TOKEN_TRO_LY:-}
      AGENT_KEY_VIVI: ${AGENT_KEY_VIVI:-}
      AGENT_KEY_KNOW: ${AGENT_KEY_KNOW:-}
    volumes:
      - hermes-data:/opt/data                     # volume cũ (trước AI-15) – .env, config.yaml, SOUL, skills, sessions
      - ./app-delicare-agents:/opt/app-delicare-agents:ro

  hermes-van-hanh:
    <<: *hermes
    container_name: delicare-hermes-van-hanh
    environment:
      <<: *hermes-env
      HERMES_GROUP: van-hanh                       # app-delicare-agents/hermes/van-hanh.config.example.yaml + node tools/agent-eval/gen-cron.mjs --group van-hanh
      AGENT_KEY_KITCHEN: ${AGENT_KEY_KITCHEN:-}
      AGENT_KEY_QA: ${AGENT_KEY_QA:-}
      AGENT_KEY_LOG: ${AGENT_KEY_LOG:-}
      AGENT_KEY_PKG: ${AGENT_KEY_PKG:-}
      AGENT_KEY_WH: ${AGENT_KEY_WH:-}
    volumes:
      - hermes-van-hanh-data:/opt/data                     # dữ liệu riêng nhóm vận hành
      - ./app-delicare-agents:/opt/app-delicare-agents:ro

  hermes-van-phong:
    <<: *hermes
    container_name: delicare-hermes-van-phong
    environment:
      <<: *hermes-env
      HERMES_GROUP: van-phong                       # app-delicare-agents/hermes/van-phong.config.example.yaml + node tools/agent-eval/gen-cron.mjs --group van-phong
      AGENT_KEY_SALES: ${AGENT_KEY_SALES:-}
      AGENT_KEY_PLAN: ${AGENT_KEY_PLAN:-}
      AGENT_KEY_PROC: ${AGENT_KEY_PROC:-}
      AGENT_KEY_HR: ${AGENT_KEY_HR:-}
      AGENT_KEY_ACC: ${AGENT_KEY_ACC:-}
      AGENT_KEY_CSKH: ${AGENT_KEY_CSKH:-}
    volumes:
      - hermes-van-phong-data:/opt/data                     # dữ liệu riêng nhóm văn phòng
      - ./app-delicare-agents:/opt/app-delicare-agents:ro

volumes:
  api-import:
  api-docs:
  hermes-data:        # hermes-vivi (giữ tên cũ)
  hermes-van-hanh-data:
  hermes-van-phong-data:
  knowledge:          # AI-1 (D-133): kho tri thức – api / job / toolgateway
