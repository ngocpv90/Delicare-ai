<form [formGroup]="formGroup" (ngSubmit)="submitForm()" novalidate class="position-relative">
  <div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" aria-label="Đóng" (click)="destroyModal(false)"></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="versionCode">Mã phiên bản</label>
        <input id="versionCode" type="text" class="form-control" formControlName="versionCode" placeholder="Trống = {mã món}-V{số}" autocomplete="off" />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="standardOutputQty">Số suất chuẩn của định lượng <span class="text-danger">(*)</span></label>
        <input id="standardOutputQty" type="text" class="form-control text-end" [class.is-invalid]="isInvalid('standardOutputQty')" appNumberInput [decimals]="2" [min]="1" formControlName="standardOutputQty" placeholder="VD: 100" />
        <div class="invalid-feedback">Phải lớn hơn 0</div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="yieldQuantity">Sản lượng thành phẩm <span class="text-danger">(*)</span></label>
        <input id="yieldQuantity" type="text" class="form-control text-end" [class.is-invalid]="isInvalid('yieldQuantity')" appNumberInput [decimals]="3" [min]="0" formControlName="yieldQuantity" />
        <div class="invalid-feedback">Vui lòng nhập dữ liệu</div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="yieldUnitId">ĐVT thành phẩm</label>
        <app-select [loading]="isLoadingList" formControlName="yieldUnitId" [items]="listUnit" bindValue="id" bindLabel="label" placeholder="Chọn ĐVT"></app-select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="yieldPercent">% thành phẩm</label>
        <input id="yieldPercent" type="text" class="form-control text-end" appNumberInput [decimals]="2" [min]="0" [max]="100" formControlName="yieldPercent" />
      </div>
      <div class="col-12 mb-3">
        <label class="form-label" for="instructions">Hướng dẫn chế biến</label>
        <textarea id="instructions" class="form-control" rows="4" formControlName="instructions" placeholder="Nhập dữ liệu"></textarea>
      </div>
      <div class="col-12 mb-3">
        <label class="form-label" for="note">Ghi chú</label>
        <textarea id="note" class="form-control" rows="2" formControlName="note" placeholder="Nhập dữ liệu"></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger light btn-sm" (click)="destroyModal(false)"><i class="fa-solid fa-xmark me-1"></i>Thoát</button>
    <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu</button>
  </div>
  <app-loading-modal *ngIf="isLoading"></app-loading-modal>
</form>
