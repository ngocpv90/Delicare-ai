<form [formGroup]="formGroup" (ngSubmit)="submitForm()" novalidate class="position-relative">
  <div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" aria-label="Đóng" (click)="destroyModal(false)"></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-xl-6 mb-3">
        <label class="form-label" for="md_code">Mã ĐVT<span class="text-danger">*</span></label>
        <input id="md_code" type="text" class="form-control" [class.is-invalid]="isInvalid('code')" formControlName="code" placeholder="Nhập dữ liệu" autocomplete="off" />
        @if (isInvalid('code')) {
          <div class="invalid-feedback d-block">Vui lòng nhập dữ liệu</div>
        }
      </div>
      <div class="col-xl-6 mb-3">
        <label class="form-label" for="md_name">Tên ĐVT<span class="text-danger">*</span></label>
        <input id="md_name" type="text" class="form-control" [class.is-invalid]="isInvalid('name')" formControlName="name" placeholder="Nhập dữ liệu" autocomplete="off" />
        @if (isInvalid('name')) {
          <div class="invalid-feedback d-block">Vui lòng nhập dữ liệu</div>
        }
      </div>
      <div class="col-xl-6 mb-3">
        <label class="form-label" for="md_symbol">Ký hiệu</label>
        <input id="md_symbol" type="text" class="form-control" [class.is-invalid]="isInvalid('symbol')" formControlName="symbol" placeholder="Nhập dữ liệu" autocomplete="off" />
      </div>
      <div class="col-xl-6 mb-3">
        <label class="form-label" for="md_unitType">Loại đơn vị</label>
        <app-select
          formControlName="unitType"
          [items]="options['uomType']"
          [invalid]="isInvalid('unitType')"
          bindValue="id"
          bindLabel="name"
          placeholder="Chọn dữ liệu"
        ></app-select>
      </div>
      <div class="col-xl-6 mb-3">
        <label class="form-label" for="md_status">Trạng thái<span class="text-danger">*</span></label>
        <app-select
          formControlName="status"
          [items]="options['status']"
          [invalid]="isInvalid('status')"
          bindValue="id"
          bindLabel="name"
          placeholder="Chọn dữ liệu"
        ></app-select>
        @if (isInvalid('status')) {
          <div class="invalid-feedback d-block">Vui lòng nhập dữ liệu</div>
        }
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger light btn-sm" (click)="destroyModal(false)">
      <i class="fa-solid fa-xmark me-1"></i>Thoát
    </button>
    <button type="submit" class="btn btn-primary btn-sm">
      <i class="fa-solid fa-floppy-disk me-1"></i>Lưu
    </button>
  </div>
  <app-loading-modal *ngIf="isLoading"></app-loading-modal>
</form>
