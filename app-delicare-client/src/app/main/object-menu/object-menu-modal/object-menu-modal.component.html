<form [formGroup]="formGroup" (ngSubmit)="submitForm()" novalidate class="position-relative">
  <div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" aria-label="Đóng" (click)="destroyModal(false)"></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="name">
          Tên chức năng <span class="text-danger">(*)</span>
        </label>
        <input
          id="name"
          type="text"
          class="form-control"
          [class.is-invalid]="isInvalid('name')"
          formControlName="name"
          placeholder="Nhập dữ liệu"
          autocomplete="off"
        />
        <div class="invalid-feedback">Vui lòng nhập dữ liệu</div>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="shortName">Tên ngắn / nhãn</label>
        <input
          id="shortName"
          type="text"
          class="form-control"
          formControlName="shortName"
          placeholder="Nhập dữ liệu"
          autocomplete="off"
        />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="parentId">Nhóm menu cha</label>
        <app-select
          [loading]="isLoadingParentId"
          formControlName="parentId"
          [items]="listParent"
          bindValue="id"
          bindLabel="name"
          placeholder="Không có (menu cấp 1)"
          (selectionChange)="onChangeParentId($event)"
        ></app-select>
        <div class="form-text">Menu chỉ có 2 cấp: để trống = nhóm cấp 1.</div>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="metaLink">
          Đường dẫn <span class="text-danger">(*)</span>
        </label>
        <input
          id="metaLink"
          type="text"
          class="form-control"
          [class.is-invalid]="isInvalid('metaLink')"
          formControlName="metaLink"
          placeholder="#/adm-user, #/group/10, #/wf-inbox?type=menu-recipe"
          autocomplete="off"
        />
        <div class="invalid-feedback">Vui lòng nhập dữ liệu</div>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="iconName">Biểu tượng</label>
        <input
          id="iconName"
          type="text"
          class="form-control"
          formControlName="iconName"
          placeholder="vd. fa-solid fa-users"
          autocomplete="off"
        />
      </div>
      <div class="col-md-3 col-6 mb-3">
        <label class="form-label" for="levelShow">Cấp</label>
        <input id="levelShow" type="text" class="form-control" formControlName="levelShow" readonly />
      </div>
      <div class="col-md-3 col-6 mb-3">
        <label class="form-label" for="orderShow">
          Thứ tự <span class="text-danger">(*)</span>
        </label>
        <input
          id="orderShow"
          type="number"
          class="form-control"
          [class.is-invalid]="isInvalid('orderShow')"
          formControlName="orderShow"
          autocomplete="off"
        />
        <div class="invalid-feedback">Vui lòng nhập dữ liệu</div>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="dataTarget">DataTarget</label>
        <div class="input-group">
          <span class="input-group-text">#</span>
          <input
            id="dataTarget"
            type="text"
            class="form-control"
            formControlName="dataTarget"
            placeholder="Nhập dữ liệu"
            autocomplete="off"
            (ngModelChange)="onChangeDataTarget($event)"
          />
        </div>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="ariaControls">AriaControls</label>
        <input id="ariaControls" type="text" class="form-control" formControlName="ariaControls" readonly />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label d-block" for="isActive">Hiển thị trên menu</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" formControlName="isActive" id="isActive" />
          <label class="form-check-label" for="isActive">
            {{ formGroup.get('isActive')?.value ? 'Có' : 'Không (ẩn)' }}
          </label>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger light btn-sm" (click)="destroyModal(false)">
      <i class="fa-solid fa-xmark me-1"></i>Thoát
    </button>
    <button type="submit" class="btn btn-primary btn-sm">
      <i class="fa-solid fa-floppy-disk me-1"></i>Lưu
    </button>
  </div>
  <app-loading-modal *ngIf="isLoading"></app-loading-modal>
</form>
