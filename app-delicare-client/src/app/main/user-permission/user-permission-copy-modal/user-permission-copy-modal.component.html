<form (ngSubmit)="submitForm()" novalidate class="position-relative">
  <div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" aria-label="Đóng" (click)="destroyModal(false)"></button>
  </div>
  <div class="modal-body">
    <div class="mb-3">
      <label class="form-label">Nhóm nhận quyền</label>
      <input type="text" class="form-control" [value]="data?.target?.name" readonly />
    </div>
    <div class="mb-3">
      <label class="form-label" for="sourceId">Sao chép từ nhóm <span class="text-danger">(*)</span></label>
      <app-select
        [items]="listSource"
        bindValue="id"
        bindLabel="name"
        placeholder="Chọn nhóm nguồn"
        [invalid]="submitted && !sourceId"
        [(ngModel)]="sourceId"
        name="sourceId"
      ></app-select>
      @if (submitted && !sourceId) {
        <div class="invalid-feedback d-block">Vui lòng chọn nhóm nguồn</div>
      }
    </div>
    <div class="alert alert-warning small mb-0">
      Toàn bộ quyền hiện tại của nhóm "{{ data?.target?.name }}" sẽ được thay bằng quyền của nhóm nguồn.
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger light btn-sm" (click)="destroyModal(false)">
      <i class="fa-solid fa-xmark me-1"></i>Thoát
    </button>
    <button type="submit" class="btn btn-primary btn-sm">
      <i class="fa-solid fa-copy me-1"></i>Sao chép
    </button>
  </div>
  <app-loading-modal *ngIf="isLoading"></app-loading-modal>
</form>
