<form [formGroup]="formGroup" (ngSubmit)="submitForm()" novalidate class="position-relative">
  <div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" aria-label="Đóng" (click)="destroyModal(false)"></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="warehouseId">Kho <span class="text-danger">(*)</span></label>
        <app-select [loading]="isLoadingList" formControlName="warehouseId" [items]="listWarehouse" bindValue="id" bindLabel="label" placeholder="Chọn kho" [invalid]="isInvalid('warehouseId')" (selectionChange)="onChangeWarehouse()"></app-select>
        @if (isInvalid('warehouseId')) {
          <div class="invalid-feedback d-block">Vui lòng chọn dữ liệu</div>
        }
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="storageZoneId">Khu bảo quản</label>
        <app-select [loading]="isLoadingList" formControlName="storageZoneId" [items]="zones" bindValue="id" bindLabel="label" placeholder="Chọn khu (theo kho)"></app-select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="code">Mã vị trí <span class="text-danger">(*)</span></label>
        <input id="code" type="text" class="form-control" [class.is-invalid]="isInvalid('code')" formControlName="code" placeholder="VD: A-01-02" autocomplete="off" />
        <div class="invalid-feedback">Vui lòng nhập mã (tối đa 50 ký tự)</div>
      </div>
      <div class="col-md-8 mb-3">
        <label class="form-label" for="name">Tên vị trí <span class="text-danger">(*)</span></label>
        <input id="name" type="text" class="form-control" [class.is-invalid]="isInvalid('name')" formControlName="name" placeholder="Nhập dữ liệu" autocomplete="off" />
        <div class="invalid-feedback">Vui lòng nhập dữ liệu</div>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="locationType">Loại vị trí</label>
        <app-select formControlName="locationType" [items]="locationTypes" bindValue="code" bindLabel="label" placeholder="Chọn loại" [searchable]="false"></app-select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="status">Trạng thái <span class="text-danger">(*)</span></label>
        <app-select formControlName="status" [items]="statuses" bindValue="code" bindLabel="label" [allowClear]="false" [searchable]="false"></app-select>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger light btn-sm" (click)="destroyModal(false)"><i class="fa-solid fa-xmark me-1"></i>Thoát</button>
    <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu</button>
  </div>
  <app-loading-modal *ngIf="isLoading"></app-loading-modal>
</form>
