# DELICARE – staging thử nghiệm bằng Docker (T48.1): SQL Server + khởi tạo DB + API. KHÔNG có Angular.
# Chạy từ thư mục gốc repo:
#   copy deploy/docker/staging.env.example deploy/docker/staging.env   (điền mật khẩu / khóa – file này KHÔNG commit)
#   docker compose -f deploy/docker/docker-compose.staging.yml --env-file deploy/docker/staging.env up -d --build
# Mở: http://localhost:8080/swagger , http://localhost:8080/health
name: delicare-staging

# T48.4 (D-60): log Docker xoay vòng (20 MB × 10) cho api / job.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Đặt SA_PASSWORD trong staging.env}
      MSSQL_PID: Developer
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "14333:1433"
    volumes:
      - delicare-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # T48.3: chạy lại bao nhiêu lần cũng được (idempotent) – cập nhật SP / seed mới sau git pull:
  #   docker compose -f deploy/docker/docker-compose.staging.yml --env-file deploy/docker/staging.env run --rm db-init
  # Thứ tự script: deploy/db/scripts.order (dùng chung với Deploy-Database.ps1).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      DB_NAME: ${DB_NAME:-AppDelicare}
      # Chỉ cần khi DB chưa có tài khoản admin (lần chạy đầu); db-init báo lỗi rõ nếu thiếu.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # T48.4 (D-60): tài khoản SQL riêng cho api / job (đọc / ghi / EXECUTE, không DDL). Không đặt = api / job vẫn dùng sa (như cũ).
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      APP_DB_RESET_PASSWORD: ${APP_DB_RESET_PASSWORD:-0}
    volumes:
      - ../../docs/reference:/repo/docs/reference:ro
      - ../../DB:/repo/DB:ro
      - ../db:/repo/deploy/db:ro
      - ./db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/bash", "/db-init.sh"]
    restart: "no"

  api:
    build:
      context: ../../AppDelicare
      dockerfile: AppDelicare.WebApi/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      TZ: Asia/Ho_Chi_Minh
      Logging__ConsoleOnly: "true"
      ConnectionStrings__MainConnectionString: "Server=db,1433;Database=${DB_NAME:-AppDelicare};User Id=${APP_DB_USER:-sa};Password=${APP_DB_PASSWORD:-${SA_PASSWORD}};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Đặt JWT_SIGNING_KEY (>= 32 ký tự) trong staging.env}
      Licenses__GemBox: ${GEMBOX_LICENSE:-}
      # BE2.7: tệp đính kèm (DocumentFile) lưu ngoài wwwroot, giữ qua lần build lại image.
      DocumentStorage__RootPath: /app/App_Data/DocumentFiles
      # BOT-1.1 / 1.2: khóa client messaging (SHA-256 hex) + khóa ký mã liên kết Telegram – trống = tắt.
      Clients__MESSAGING__KeyHash: ${MESSAGING_CLIENT_KEY_HASH:-}
      Messaging__LinkSigningKey: ${MESSAGING_LINK_SIGNING_KEY:-}
    volumes:
      - delicare-docs:/app/App_Data/DocumentFiles
    ports:
      - "8080:8080"
    restart: unless-stopped
    logging: *logging

  # T23 (D-48): job tự động – container riêng, ĐÚNG 1 bản (không scale). Lịch: Jobs:<mã> trong appsettings.json của WebApi (giờ VN);
  # tắt 1 job: Jobs__LockOrders__Enabled: "false". Xem / chạy tay: api/Job/GetAll, api/Job/Run (admin).
  job:
    build:
      context: ../../AppDelicare
      dockerfile: AppDelicare.Job/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Staging
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__MainConnectionString: "Server=db,1433;Database=${DB_NAME:-AppDelicare};User Id=${APP_DB_USER:-sa};Password=${APP_DB_PASSWORD:-${SA_PASSWORD}};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Licenses__GemBox: ${GEMBOX_LICENSE:-}
      DocumentStorage__RootPath: /app/App_Data/DocumentFiles
    volumes:
      - delicare-docs:/app/App_Data/DocumentFiles
    restart: unless-stopped
    logging: *logging

  # BOT-1.3 (D-62): container messaging – TẤT CẢ bot (Telegram VH / DH), ĐÚNG 1 bản. Không chuỗi kết nối DB – gọi api qua mạng Docker.
  messaging:
    build:
      context: ../../AppDelicare
      dockerfile: AppDelicare.Messaging/Dockerfile
    depends_on:
      - api
    environment:
      TZ: Asia/Ho_Chi_Minh
      Messaging__ApiBaseUrl: http://api:8080
      Messaging__ClientKey: ${MESSAGING_CLIENT_KEY:-}
      Messaging__Mode: ${MESSAGING_MODE:-Polling}
      Messaging__WebhookBaseUrl: ${MESSAGING_WEBHOOK_BASE_URL:-}
      Telegram__Bots__VH__Token: ${TELEGRAM_VH_TOKEN:-}
      Telegram__Bots__VH__WebhookSecret: ${TELEGRAM_VH_WEBHOOK_SECRET:-}
      Telegram__Bots__VH__Username: ${TELEGRAM_VH_USERNAME:-}
      Telegram__Bots__DH__Token: ${TELEGRAM_DH_TOKEN:-}
      Telegram__Bots__DH__WebhookSecret: ${TELEGRAM_DH_WEBHOOK_SECRET:-}
      Telegram__Bots__DH__Username: ${TELEGRAM_DH_USERNAME:-}
    expose:
      - "8080"
    restart: unless-stopped
    logging: *logging

volumes:
  delicare-sql:
  delicare-docs:
