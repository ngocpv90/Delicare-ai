# DELICARE – PRODUCTION trên Linux + Docker (T48.4, D-60). KHÔNG kèm SQL Server (SQL Server riêng: server / container có ổ dữ liệu + backup).
# Chuẩn bị trên server (thư mục chứa repo):
#   cp deploy/docker/production.env.example deploy/docker/production.env   (điền – file này KHÔNG commit)
#   đặt chứng chỉ HTTPS: deploy/docker/certs/fullchain.pem + privkey.pem (KHÔNG commit)
#   docker compose -f deploy/docker/docker-compose.production.yml --env-file deploy/docker/production.env run --rm db-init   (lần đầu / sau mỗi bản mới)
#   docker compose -f deploy/docker/docker-compose.production.yml --env-file deploy/docker/production.env up -d --build
# Thành phần: nginx (Angular build + HTTPS + /api → api, /tg/ → messaging), api (scale được), job (ĐÚNG 1 bản), messaging (bot – ĐÚNG 1 bản), db-init (chạy tay, dùng tài khoản quản trị SQL).
# Bí mật chỉ nằm trong production.env trên server. api / job dùng tài khoản SQL riêng (APP_DB_USER – đọc / ghi / EXECUTE, không DDL), không dùng sa.
name: delicare-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"

x-app-env: &app-env
  TZ: Asia/Ho_Chi_Minh
  ConnectionStrings__MainConnectionString: "Server=${DB_SERVER:?Đặt DB_SERVER};Database=${DB_NAME:-AppDelicare};User Id=${APP_DB_USER:?Đặt APP_DB_USER};Password=${APP_DB_PASSWORD:?Đặt APP_DB_PASSWORD};Encrypt=${DB_ENCRYPT:-True};TrustServerCertificate=${DB_TRUST_CERT:-False};MultipleActiveResultSets=true;"
  Licenses__GemBox: ${GEMBOX_LICENSE:-}
  DocumentStorage__RootPath: /app/App_Data/DocumentFiles
  Logging__ConsoleOnly: "true"
  Iot__ApiKeys__0: ${IOT_API_KEY_0:-}
  Iot__ApiKeys__1: ${IOT_API_KEY_1:-}
  # BOT-1.1 (D-62): SHA-256 (hex) của khóa client container messaging – trống = tắt api/BotChannel (401).
  Clients__MESSAGING__KeyHash: ${MESSAGING_CLIENT_KEY_HASH:-}
  # BOT-1.2: khóa ký mã liên kết Telegram (≥ 32 ký tự) – trống = tắt liên kết bằng mã.
  Messaging__LinkSigningKey: ${MESSAGING_LINK_SIGNING_KEY:-}

# AI-24 (D-142 b): Trợ lý AI – mẫu chung 3 container Hermes (profile "hermes"; lệnh "up" thường không đụng tới) + biến agent cho api.
x-hermes: &hermes
  profiles: ["hermes"]
  image: nousresearch/hermes-agent:latest
  command: ["gateway", "run"]
  depends_on:
    - toolgateway
  expose:
    - "8642"                                       # API server Hermes – chỉ mạng nội bộ (api gọi chat web)
  restart: unless-stopped
  logging: *logging

x-hermes-env: &hermes-env
  TZ: Asia/Ho_Chi_Minh
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  HERMES_MODEL_DEFAULT: ${HERMES_MODEL_DEFAULT:-claude-sonnet-5-5}
  HERMES_MODEL_SCHEDULED: ${HERMES_MODEL_SCHEDULED:-claude-haiku-5-5}
  API_SERVER_KEY: ${HERMES_API_KEY:-}             # khóa API server Hermes – api gửi Bearer cùng giá trị

# api: kho tri thức, lịch / câu nhanh / bản tin (app-delicare-agents chỉ đọc), khóa agent (Trung tâm Agent báo "có khóa"), địa chỉ Hermes theo nhóm, ngân sách AI.
x-agent-api-env: &agent-api-env
  Knowledge__VaultPath: /app/App_Data/Knowledge
  Agent__SchedulesFile: /app/app-delicare-agents/schedules.json
  Agent__MonthlyBudget: ${AGENT_MONTHLY_BUDGET:-}
  HERMES_API_KEY: ${HERMES_API_KEY:-}
  Agent__HermesApiUrl: http://hermes-vivi:8642/v1
  Agent__HermesApiUrlByAgent__KITCHEN: http://hermes-van-hanh:8642/v1
  Agent__HermesApiUrlByAgent__QA: http://hermes-van-hanh:8642/v1
  Agent__HermesApiUrlByAgent__LOG: http://hermes-van-hanh:8642/v1
  Agent__HermesApiUrlByAgent__PKG: http://hermes-van-hanh:8642/v1
  Agent__HermesApiUrlByAgent__WH: http://hermes-van-hanh:8642/v1
  Agent__HermesApiUrlByAgent__SALES: http://hermes-van-phong:8642/v1
  Agent__HermesApiUrlByAgent__PLAN: http://hermes-van-phong:8642/v1
  Agent__HermesApiUrlByAgent__PROC: http://hermes-van-phong:8642/v1
  Agent__HermesApiUrlByAgent__HR: http://hermes-van-phong:8642/v1
  Agent__HermesApiUrlByAgent__ACC: http://hermes-van-phong:8642/v1
  Agent__HermesApiUrlByAgent__CSKH: http://hermes-van-phong:8642/v1
  AGENT_KEY_VIVI: ${AGENT_KEY_VIVI:-}
  AGENT_KEY_KNOW: ${AGENT_KEY_KNOW:-}
  AGENT_KEY_KITCHEN: ${AGENT_KEY_KITCHEN:-}
  AGENT_KEY_QA: ${AGENT_KEY_QA:-}
  AGENT_KEY_LOG: ${AGENT_KEY_LOG:-}
  AGENT_KEY_PKG: ${AGENT_KEY_PKG:-}
  AGENT_KEY_WH: ${AGENT_KEY_WH:-}
  AGENT_KEY_SALES: ${AGENT_KEY_SALES:-}
  AGENT_KEY_PLAN: ${AGENT_KEY_PLAN:-}
  AGENT_KEY_PROC: ${AGENT_KEY_PROC:-}
  AGENT_KEY_HR: ${AGENT_KEY_HR:-}
  AGENT_KEY_ACC: ${AGENT_KEY_ACC:-}
  AGENT_KEY_CSKH: ${AGENT_KEY_CSKH:-}

services:
  # Chạy tay khi cài lần đầu / cập nhật bản mới (SP + seed theo deploy/db/scripts.order; tạo tài khoản SQL ứng dụng).
  # Dùng tài khoản quản trị SQL (DB_ADMIN_USER / DB_ADMIN_PASSWORD) – CHỈ ở đây.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["tools"]
    environment:
      DB_SERVER: ${DB_SERVER}
      DB_USER: ${DB_ADMIN_USER:-sa}
      SA_PASSWORD: ${DB_ADMIN_PASSWORD:?Đặt DB_ADMIN_PASSWORD}
      DB_NAME: ${DB_NAME:-AppDelicare}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_RESET_PASSWORD: ${APP_DB_RESET_PASSWORD:-0}
    volumes:
      - ../../docs/reference:/repo/docs/reference:ro
      - ../../DB:/repo/DB:ro
      - ../db:/repo/deploy/db:ro
      - ./db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/bash", "/db-init.sh"]
    restart: "no"
    logging: *logging

  api:
    build:
      context: ../../AppDelicare
      dockerfile: AppDelicare.WebApi/Dockerfile
    environment:
      <<: [*app-env, *agent-api-env]
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Đặt JWT_SIGNING_KEY (>= 32 ký tự)}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-}
    volumes:
      - delicare-docs:/app/App_Data/DocumentFiles
      - knowledge:/app/App_Data/Knowledge          # AI-24: kho tri thức
      - ../../app-delicare-agents:/app/app-delicare-agents:ro   # schedules.json, quick.yaml, ban-tin.yaml – chỉ đọc
    expose:
      - "8080"
    restart: unless-stopped
    logging: *logging

  # ĐÚNG 1 bản (không scale): lịch Jobs:<mã> trong appsettings.json của WebApi; khóa sp_getapplock chống chạy trùng nếu lỡ chạy 2 bản.
  job:
    build:
      context: ../../AppDelicare
      dockerfile: AppDelicare.Job/Dockerfile
    environment:
      <<: *app-env
      DOTNET_ENVIRONMENT: Production
      Knowledge__VaultPath: /app/App_Data/Knowledge                  # AI-24: bản tin Ban GĐ ghi thư mục 10, gộp nhật ký
      Agent__SchedulesFile: /app/app-delicare-agents/schedules.json  # AI-25: bản tin (ban-tin.yaml) + cảnh báo theo mẫu (vivi-events)
    volumes:
      - delicare-docs:/app/App_Data/DocumentFiles
      - knowledge:/app/App_Data/Knowledge
      - ../../app-delicare-agents:/app/app-delicare-agents:ro
    restart: unless-stopped
    logging: *logging

  # BOT-1.3 (D-62): container messaging – TẤT CẢ bot (Telegram VH / DH), ĐÚNG 1 bản. Không chuỗi kết nối DB – gọi api qua mạng Docker.
  messaging:
    build:
      context: ../../AppDelicare
      dockerfile: AppDelicare.Messaging/Dockerfile
    depends_on:
      - api
    environment:
      TZ: Asia/Ho_Chi_Minh
      Messaging__ApiBaseUrl: http://api:8080
      Messaging__ClientKey: ${MESSAGING_CLIENT_KEY:-}
      Messaging__Mode: Webhook
      Messaging__WebhookBaseUrl: https://${SERVER_NAME:?Đặt SERVER_NAME (domain)}
      Messaging__WebUrl: https://${SERVER_NAME:?Đặt SERVER_NAME (domain)}   # AI-25.3: nút 🌐 Mở trên web của 💬 Hỏi nhanh
      Telegram__Bots__VH__Token: ${TELEGRAM_VH_TOKEN:-}
      Telegram__Bots__VH__WebhookSecret: ${TELEGRAM_VH_WEBHOOK_SECRET:-}
      Telegram__Bots__VH__Username: ${TELEGRAM_VH_USERNAME:-}
      Telegram__Bots__DH__Token: ${TELEGRAM_DH_TOKEN:-}
      Telegram__Bots__DH__WebhookSecret: ${TELEGRAM_DH_WEBHOOK_SECRET:-}
      Telegram__Bots__DH__Username: ${TELEGRAM_DH_USERNAME:-}
    expose:
      - "8080"
    restart: unless-stopped
    logging: *logging

  nginx:
    build:
      context: ../..
      dockerfile: deploy/docker/nginx/Dockerfile
    depends_on:
      - api
    environment:
      SERVER_NAME: ${SERVER_NAME:?Đặt SERVER_NAME (domain)}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    logging: *logging

  # AI-24 (D-142 b) / AI-1 (D-133): ToolGateway – MCP /mcp + REST /tools/{name} cho Hermes. CHỈ mạng nội bộ (expose, KHÔNG ports; nginx KHÔNG chuyển ra ngoài).
  # Chỉ gọi Service (không SQL riêng ngoài chuỗi kết nối như api); khóa agent qua AGENT_KEY_<MÃ> (tên ở BotConfiguration.SecretReference).
  toolgateway:
    build:
      context: ../../AppDelicare
      dockerfile: AppDelicare.ToolGateway/Dockerfile
    environment:
      <<: *app-env
      ASPNETCORE_ENVIRONMENT: Production
      Knowledge__VaultPath: /app/App_Data/Knowledge
      AGENT_KEY_VIVI: ${AGENT_KEY_VIVI:-}
      AGENT_KEY_KNOW: ${AGENT_KEY_KNOW:-}
      AGENT_KEY_KITCHEN: ${AGENT_KEY_KITCHEN:-}
      AGENT_KEY_QA: ${AGENT_KEY_QA:-}
      AGENT_KEY_LOG: ${AGENT_KEY_LOG:-}
      AGENT_KEY_PKG: ${AGENT_KEY_PKG:-}
      AGENT_KEY_WH: ${AGENT_KEY_WH:-}
      AGENT_KEY_SALES: ${AGENT_KEY_SALES:-}
      AGENT_KEY_PLAN: ${AGENT_KEY_PLAN:-}
      AGENT_KEY_PROC: ${AGENT_KEY_PROC:-}
      AGENT_KEY_HR: ${AGENT_KEY_HR:-}
      AGENT_KEY_ACC: ${AGENT_KEY_ACC:-}
      AGENT_KEY_CSKH: ${AGENT_KEY_CSKH:-}
    volumes:
      - delicare-docs:/app/App_Data/DocumentFiles
      - knowledge:/app/App_Data/Knowledge
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]   # image đã có curl (Dockerfile ToolGateway)
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging

  # AI-15 / AI-24: Hermes tách 3 container theo nhóm (app-delicare-agents/hermes/groups.json): hermes-vivi (VIVI, KNOW – bot Trợ lý + chat web),
  # hermes-van-hanh (KITCHEN, QA, LOG, PKG, WH), hermes-van-phong (SALES, PLAN, PROC, HR, ACC, CSKH). Cài đặt: deploy/README.md mục 13.
  hermes-vivi:
    <<: *hermes
    environment:
      <<: *hermes-env
      HERMES_GROUP: vivi                       # app-delicare-agents/hermes/vivi.config.example.yaml + node tools/agent-eval/gen-cron.mjs --group vivi
      TELEGRAM_BOT_TOKEN_TRO_LY: ${TELEGRAM_BOT_TOKEN_TRO_LY:-}       # bot Trợ lý TEST / PROD riêng (@BotFather)
      AGENT_KEY_VIVI: ${AGENT_KEY_VIVI:-}
      AGENT_KEY_KNOW: ${AGENT_KEY_KNOW:-}
    volumes:
      - hermes-vivi-data:/opt/data                     # MỖI container ĐÚNG 1 volume riêng (.env, config.yaml, SOUL, skills, sessions) – không dùng chung
      - ../../app-delicare-agents:/opt/app-delicare-agents:ro

  hermes-van-hanh:
    <<: *hermes
    environment:
      <<: *hermes-env
      HERMES_GROUP: van-hanh                       # app-delicare-agents/hermes/van-hanh.config.example.yaml + node tools/agent-eval/gen-cron.mjs --group van-hanh
      AGENT_KEY_KITCHEN: ${AGENT_KEY_KITCHEN:-}
      AGENT_KEY_QA: ${AGENT_KEY_QA:-}
      AGENT_KEY_LOG: ${AGENT_KEY_LOG:-}
      AGENT_KEY_PKG: ${AGENT_KEY_PKG:-}
      AGENT_KEY_WH: ${AGENT_KEY_WH:-}
    volumes:
      - hermes-van-hanh-data:/opt/data                     # MỖI container ĐÚNG 1 volume riêng (.env, config.yaml, SOUL, skills, sessions) – không dùng chung
      - ../../app-delicare-agents:/opt/app-delicare-agents:ro

  hermes-van-phong:
    <<: *hermes
    environment:
      <<: *hermes-env
      HERMES_GROUP: van-phong                       # app-delicare-agents/hermes/van-phong.config.example.yaml + node tools/agent-eval/gen-cron.mjs --group van-phong
      AGENT_KEY_SALES: ${AGENT_KEY_SALES:-}
      AGENT_KEY_PLAN: ${AGENT_KEY_PLAN:-}
      AGENT_KEY_PROC: ${AGENT_KEY_PROC:-}
      AGENT_KEY_HR: ${AGENT_KEY_HR:-}
      AGENT_KEY_ACC: ${AGENT_KEY_ACC:-}
      AGENT_KEY_CSKH: ${AGENT_KEY_CSKH:-}
    volumes:
      - hermes-van-phong-data:/opt/data                     # MỖI container ĐÚNG 1 volume riêng (.env, config.yaml, SOUL, skills, sessions) – không dùng chung
      - ../../app-delicare-agents:/opt/app-delicare-agents:ro

volumes:
  delicare-docs:
  knowledge:                                   # AI-24: kho tri thức (api / job / toolgateway) – sao lưu hằng đêm cùng delicare-docs
  hermes-vivi-data:
  hermes-van-hanh-data:
  hermes-van-phong-data:
