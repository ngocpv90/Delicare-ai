<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bộ biểu tượng agent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 880px; min-height: 740px; box-sizing: border-box; padding: 32px; background: #fff; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #263238; font-size: 14px; display: flex; flex-direction: column; gap: 20px">
<div><h1 style="margin: 0; font-size: 22px">Bộ biểu tượng 13 agent</h1><div style="color: #546E7A; margin-top: 4px">Nét vẽ 1,8 px trên ô bo góc màu nhạt. Màu riêng mỗi agent, dùng chung cho thẻ, nhật ký, chat và bot.</div></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{items}}" as="a" hint-placeholder-count="13">
<div style="border: 1px solid #E8ECE5; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
<span style="{{a.ic.box}}"><svg width="{{a.ic.sz}}" height="{{a.ic.sz}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.ic.d}}"></path></svg></span>
<b style="font-size: 13px">{{a.code}}</b>
<span style="font-size: 13px; color: #455A64">{{a.name}}</span>
<span style="font-size: 12px; color: #607D6B">{{a.ic.fg}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 18px; align-items: center; color: #546E7A; font-size: 13px">Cỡ dùng:
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><span style="display: flex; gap: 8px; align-items: center"><span style="{{s.ic.box}}"><svg width="{{s.ic.sz}}" height="{{s.ic.sz}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.ic.d}}"></path></svg></span>{{s.label}}</span></sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":740}}'>
const IC = {VIVI:['#3A5115','#E4EFD2','M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0M3 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M17 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M10 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M6.5 6.5l3.4 3.4M17.5 6.5l-3.4 3.4M12 15v3'],SALES:['#B4413F','#FCE4E3','M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18'],PLAN:['#2F6DB5','#E1ECFA','M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2zM8 3v4M16 3v4M3 10h18M8 14h3M8 17h6'],PROC:['#8C6D00','#F8EDC2','M3 4h2l2.4 11h11L21 8H6.2M7.5 19a1.5 1.5 0 1 0 3.0 0a1.5 1.5 0 1 0 -3.0 0M15.5 19a1.5 1.5 0 1 0 3.0 0a1.5 1.5 0 1 0 -3.0 0'],WH:['#2E7D32','#E3F3E2','M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8'],KITCHEN:['#B4570F','#FDE8D6','M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 10h20M9 7c0-1 1-1.5 1-3M14 7c0-1 1-1.5 1-3'],QA:['#0F7B6C','#D9F2EE','M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5'],LOG:['#1A6FA0','#DCEFFA','M2 6h11v10H2zM13 10h4l4 3v3h-8M4 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M15 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0'],PKG:['#4E7F75','#E2EFEC','M4 9h16l-1.5 9h-13zM8 9V6h8v3M9 13h6'],HR:['#5B4BB0','#E9E6F8','M6 8a3 3 0 1 0 6 0a3 3 0 1 0 -6 0M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.5 9a2.5 2.5 0 1 0 5.0 0a2.5 2.5 0 1 0 -5.0 0M16 14c3 0 5 2 5 5'],ACC:['#8A4B22','#F5E5DA','M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2zM8 7h8M8 12h2M14 12h2M8 16h2M14 16h2'],CSKH:['#A63366','#FAE1EC','M4 5h16v11H9l-5 4zM8 9h8M8 12h5'],KNOW:['#5E6B12','#EEF1D6','M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z']};
const ico = (k, s) => { const c = IC[k] || IC.VIVI, z = s || 36; return { d: c[2], fg: c[0], box: 'flex:none;width:' + z + 'px;height:' + z + 'px;border-radius:' + Math.round(z * .28) + 'px;background:' + c[1] + ';color:' + c[0] + ';display:flex;align-items:center;justify-content:center', sz: Math.round(z * .58) }; };
const NAMES = [['VIVI','Điều phối'],['SALES','Kinh doanh'],['PLAN','Kế hoạch & thực đơn'],['PROC','Thu mua'],['WH','Kho'],['KITCHEN','Bếp & sản xuất'],['QA','ATTP & truy xuất'],['LOG','Giao vận'],['PKG','Hộp khay & vệ sinh'],['HR','Nhân sự'],['ACC','Kế toán'],['CSKH','Chăm sóc khách'],['KNOW','Thủ thư tri thức']];
class Component extends DCLogic {
  renderVals() {
    return {
      items: NAMES.map(n => ({ code: n[0], name: n[1], ic: ico(n[0], 56) })),
      sizes: [[24, 'Nhật ký, chip'], [36, 'Thẻ, danh sách'], [56, 'Trang chi tiết']].map(s => ({ label: s[1] + ' · ' + s[0] + ' px', ic: ico('KITCHEN', s[0]) }))
    };
  }
}
</script>
</body>
</html>
