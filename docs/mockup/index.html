<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DELI-CARE | Enterprise Management – Mockup</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu chính">
    <div class="brand">
      <div class="brand-mark">🥕</div>
      <div class="brand-copy"><div class="brand-name">DELI-CARE</div><div class="brand-sub">ENTERPRISE MANAGEMENT</div></div>
    </div>
    <button class="side-context" id="sideContext" title="Chọn đơn vị làm việc">
      <span class="context-icon"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5"/></svg></span>
      <span class="context-copy"><b id="sideBranch">Tất cả đơn vị</b><small>OrganizationUnit · BRANCH</small></span><span>⌄</span>
    </button>
    <nav class="side-scroll" id="navGroups"></nav>
    <div class="side-bottom">
      <button class="nav-link" id="helpLink"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>Hướng dẫn trình diễn</span></button>
      <button class="profile nav-link" data-role-btn title="Đổi vai trò xem mockup"><div class="avatar js-avatar">AD</div><div class="profile-copy"><b id="userName">Quản trị hệ thống</b><small id="userRole">admin</small></div></button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="backdrop"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Mở menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="icon-btn desktop-collapse" id="collapseBtn" aria-label="Thu gọn menu"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="globalSearch" placeholder="Tìm chức năng, bảng DB, khách hàng, đơn hàng, nguyên liệu, lô…" autocomplete="off"><div class="search-results" id="searchResults"></div></label>
      <div class="top-spacer"></div>
      <span class="demo-ribbon" title="Toàn bộ số liệu là dữ liệu mẫu">DỮ LIỆU DEMO</span>
      <button class="branch-select" id="branchSelect"><span class="branch-dot"></span><span class="branch-text"><small>ĐƠN VỊ LÀM VIỆC</small><b id="topBranch">Tất cả đơn vị</b></span><span>⌄</span></button>
      <button class="icon-btn" id="notificationBtn" title="Cảnh báo & công việc"><svg class="i" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i class="notify-dot" id="notifyCount">0</i></button>
      <button class="icon-btn" id="helpBtn" title="Hướng dẫn"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1.1 1-1.9 1.4-1.9 3M12 17.5h.01"/></svg></button>
      <button class="user btn ghost" data-role-btn title="Đổi vai trò"><div class="avatar js-avatar">AD</div><div class="user-copy"><b>Vai trò</b><small>bấm để đổi</small></div></button>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript>Cần bật JavaScript để chạy mockup.</noscript>
<!-- Dữ liệu sinh tự động từ SQL + Dictionary -->
<script src="js/data/schema.js"></script>
<script src="js/data/catalog.js"></script>
<script src="js/data/demo-data.js"></script>
<!-- Core -->
<script src="js/core/util.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/app.js"></script>
<!-- Màn hình chuyên biệt theo module -->
<script src="js/modules/dashboard.js"></script>
<script src="js/modules/sales.js"></script>
<script src="js/modules/menu.js"></script>
<script src="js/modules/scm.js"></script>
<script src="js/modules/production.js"></script>
<script src="js/modules/qc.js"></script>
<script src="js/modules/logistics.js"></script>
<script src="js/modules/hr.js"></script>
<script src="js/modules/admin.js"></script>
<script src="js/modules/integration.js"></script>
<script src="js/modules/explorer.js"></script>
<script>APP.start();</script>
</body>
</html>
