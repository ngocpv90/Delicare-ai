# AI-15 (D-133) – MẪU cấu hình container hermes-van-hanh (agent: KITCHEN, QA, LOG, PKG, WH). Cùng nội dung agents/hermes.config.example.yaml, chỉ khác mcp_servers / platforms / api_server.
# Chép vào HERMES_HOME (~/.hermes/config.yaml hoặc volume hermes-van-hanh-data:/opt/data/config.yaml của container hermes-van-hanh) rồi chỉnh. KHÔNG ghi khóa thật vào tệp này:
# mọi khóa đọc từ biến môi trường (${TÊN}) – đặt ở .env của server / docker compose, không commit.
model:
  provider: anthropic
  default: ${HERMES_MODEL_DEFAULT:-claude-sonnet-5-5}     # VIVI + phân tích
  api_key: ${ANTHROPIC_API_KEY}
auxiliary:
  compression:
    model: ${HERMES_MODEL_SCHEDULED:-claude-haiku-5-5}   # việc theo lịch / nén ngữ cảnh

agent:
  # D-133: Hermes KHÔNG có terminal / file / code / browser / web – chỉ MCP trỏ ToolGateway.
  disabled_toolsets: [terminal, file, code_execution, browser, computer_use, delegation, cronjob, web, search, x_search, image_gen, video_gen, tts, kanban, catalog, connections]
skills:
  write_approval: true

# Mỗi agent MỘT mục MCP + khóa riêng (ToolGateway biết agent nào gọi, kiểm quyền agent ∩ người hỏi).
# Hermes gắn thêm X-On-Behalf-Of = Telegram user id (bot Trợ lý) hoặc vé web:… (chat web AI-14, nhận ở trường onBehalfOf của POST /chat) – người chưa liên kết DELI-CARE bị ToolGateway từ chối.
mcp_servers:
  delicare-kitchen:
    url: http://toolgateway:8080/mcp
    headers: { X-Agent-Code: KITCHEN, X-Agent-Key: "${AGENT_KEY_KITCHEN}" }
    timeout: 120
    connect_timeout: 30
    tools: { prompts: false, resources: false }
  delicare-qa:
    url: http://toolgateway:8080/mcp
    headers: { X-Agent-Code: QA, X-Agent-Key: "${AGENT_KEY_QA}" }
    timeout: 120
    connect_timeout: 30
    tools: { prompts: false, resources: false }
  delicare-log:
    url: http://toolgateway:8080/mcp
    headers: { X-Agent-Code: LOG, X-Agent-Key: "${AGENT_KEY_LOG}" }
    timeout: 120
    connect_timeout: 30
    tools: { prompts: false, resources: false }
  delicare-pkg:
    url: http://toolgateway:8080/mcp
    headers: { X-Agent-Code: PKG, X-Agent-Key: "${AGENT_KEY_PKG}" }
    timeout: 120
    connect_timeout: 30
    tools: { prompts: false, resources: false }
  delicare-wh:
    url: http://toolgateway:8080/mcp
    headers: { X-Agent-Code: WH, X-Agent-Key: "${AGENT_KEY_WH}" }
    timeout: 120
    connect_timeout: 30
    tools: { prompts: false, resources: false }

# Container này KHÔNG chạy bot Telegram (bot Trợ lý ở hermes-vivi) – chỉ việc theo lịch + chat web.
platforms: {}

# API server (chat web AI-14): cổng 8642, khóa API_SERVER_KEY (biến môi trường của container).
api_server:                     # tên khóa theo tài liệu Hermes bản đang chạy – kiểm lại khi cài thật (cửa đợt 2)
  enabled: true
  port: 8642
  key: ${API_SERVER_KEY}
# Kỹ năng: agents/<MÃ>/SOUL.md → skills/delicare-<mã>/SKILL.md cho KITCHEN, QA, LOG, PKG, WH.
# Lịch: node tools/agent-eval/gen-cron.mjs --group van-hanh (từ agents/schedules.json, chỉ agent của nhóm) – hạn chót nghiệp vụ vẫn do job lõi AppDelicare.Job.
timezone: Asia/Ho_Chi_Minh
